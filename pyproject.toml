[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "redhand"
version = "0.1.0"
description = "Which of your components start a CRA Article 14 24-hour reporting clock"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["cra", "cyber-resilience-act", "sbom", "kev", "epss", "compliance"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]

# No runtime dependencies, on purpose. This has to drop into any CI image
# without a resolver step, and a supply-chain tool that drags in a dependency
# tree is arguing against itself.
dependencies = []

[project.scripts]
redhand = "redhand.cli:main"

[project.urls]
Homepage = "https://github.com/pacordelcw/redhand"

[tool.setuptools.packages.find]
include = ["redhand*"]
