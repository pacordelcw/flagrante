name: Publish to PyPI

# Trusted Publishing: PyPI verifies this workflow's identity through OIDC and
# issues a short-lived token for that one upload. There is no API token stored
# anywhere -- not in the repo, not in secrets, not on a laptop -- so there is
# nothing to leak and nothing to remember to revoke.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Publishing is irreversible: a version number, once used, can never be
  # reused even after a delete. So the package is proved to work before it is
  # allowed anywhere near PyPI.
  verify:
    name: Prove the artifact before publishing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tag must match the packaged version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(python -c "import re,pathlib; print(re.search(r'^version = \"([^\"]+)\"', pathlib.Path('pyproject.toml').read_text(), re.M).group(1))")
          echo "tag=$tag packaged=$pkg"
          test "$tag" = "$pkg" || {
            echo "::error::tag v$tag does not match version $pkg in pyproject.toml"
            exit 1
          }

      - run: python -m unittest discover -s tests -v

      - name: Build
        run: |
          python -m pip install --quiet build twine
          python -m build
          python -m twine check dist/*

      - name: Install the wheel clean and run it for real
        run: |
          python -m venv /tmp/check
          /tmp/check/bin/python -m pip install --quiet dist/*.whl

          # No dependencies is a promise the README makes. Hold it to it.
          deps=$(/tmp/check/bin/python -m pip list --format=freeze | grep -vE '^(pip|setuptools|wheel|flagrante)==' || true)
          test -z "$deps" || { echo "::error::unexpected dependencies: $deps"; exit 1; }

          # Log4Shell has been in CISA KEV since 2021. If the installed package
          # stops flagging it, the artifact is broken in the one direction that
          # matters, and no version number should be spent on it.
          /tmp/check/bin/flagrante samples/sample-cyclonedx.json --json --fail-on never > out.json
          python - <<'PY'
          import json
          r = json.load(open("out.json"))
          assert r["counts"]["clock_running"] >= 1, "installed package found no exploited component"
          assert "CVE-2021-44228" in {f["cve"] for f in r["findings"]}, "Log4Shell missing"
          for phrase in ("you are compliant", "no action needed"):
              assert phrase not in r["verdict"].lower(), f"verdict softened: {phrase}"
          print("artifact behaves:", r["counts"])
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/flagrante
    permissions:
      id-token: write # the whole point: OIDC instead of a stored token
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
